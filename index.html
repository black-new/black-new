<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BLACKCLUB Poker</title>
<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
<style>
:root {
  --gold:#e8bd62;
  --gold2:#9b7131;
  --bg:#070908;
  --panel:#111714;
  --green:#075b3c;
  --text:#f5f0e5;
  --muted:#9b9b91;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
}
button,input{font:inherit}
button{cursor:pointer}
header{
  height:72px;
  padding:0 5%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid #302719;
  background:#090c0a;
  position:sticky;
  top:0;
  z-index:10;
}
.logo{
  color:var(--gold);
  font-size:25px;
  font-weight:900;
  letter-spacing:3px;
}
.logo span{color:white}
.header-right{
  display:flex;
  align-items:center;
  gap:15px;
  color:var(--muted);
  font-size:13px;
}
.online-dot{
  display:inline-block;
  width:8px;height:8px;
  border-radius:50%;
  background:#36d887;
  margin-right:6px;
}
main{
  width:min(1200px,94%);
  margin:30px auto;
}
.hero{
  padding:35px;
  border:1px solid #3d3020;
  border-radius:15px;
  background:linear-gradient(120deg,#171b15,#090c0a);
  margin-bottom:25px;
}
.hero h1{
  font-size:clamp(27px,5vw,45px);
  color:var(--gold);
  margin:0 0 10px;
  letter-spacing:2px;
}
.hero p{color:var(--muted);margin:0}
.nav-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  margin-bottom:25px;
}
.nav-card{
  padding:22px;
  border:1px solid #47371f;
  background:#111612;
  border-radius:12px;
  text-align:center;
  color:var(--gold);
  font-weight:bold;
  font-size:17px;
}
.nav-card:hover{
  background:#1d241b;
  border-color:var(--gold);
}
.panel{
  background:var(--panel);
  border:1px solid #30291e;
  border-radius:14px;
  padding:22px;
  margin-bottom:20px;
}
.panel-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}
.panel-title h2{
  color:var(--gold);
  font-size:20px;
  margin:0;
}
.tabs{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}
.tab{
  border:1px solid #4a3b26;
  color:#c9b994;
  background:#151914;
  padding:10px 16px;
  border-radius:8px;
}
.tab.active{
  background:var(--gold);
  color:#17130b;
  font-weight:bold;
}
.table-list{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}
.table-card{
  background:#0b100d;
  border:1px solid #34372a;
  padding:17px;
  border-radius:11px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}
.table-card h3{margin:0 0 7px;color:var(--gold)}
.table-card p{margin:0;color:var(--muted);font-size:13px}
.gold-btn{
  border:0;
  border-radius:8px;
  padding:11px 18px;
  background:linear-gradient(135deg,#f4d58a,#b88736);
  color:#171108;
  font-weight:bold;
}
.gold-btn:hover{filter:brightness(1.1)}
.secondary-btn{
  border:1px solid #67512d;
  background:#171b15;
  color:var(--gold);
  border-radius:8px;
  padding:10px 15px;
}
#tablePage{display:none}
.poker-table{
  width:100%;
  min-height:490px;
  position:relative;
  background:#075536;
  border:12px solid #533a20;
  border-radius:25px;
  box-shadow:inset 0 0 0 4px #c59a4c,0 12px 35px #000;
  overflow:hidden;
  margin:20px 0;
}
.table-inner{
  position:absolute;
  inset:15px;
  border:2px solid rgba(238,205,133,.45);
  border-radius:15px;
}
.table-name{
  position:absolute;
  top:18px;
  left:50%;
  transform:translateX(-50%);
  color:#e8d4a5;
  font-weight:bold;
  letter-spacing:2px;
}
.pot{
  position:absolute;
  top:25%;
  left:50%;
  transform:translateX(-50%);
  text-align:center;
  color:white;
  font-weight:bold;
}
.pot small{display:block;color:#e8d4a5;margin-bottom:5px}
.board{
  position:absolute;
  top:43%;
  left:50%;
  transform:translate(-50%,-50%);
  display:flex;
  gap:7px;
}
.playing-card{
  width:43px;
  height:61px;
  border-radius:6px;
  background:#fff;
  color:#111;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:19px;
  font-weight:bold;
  box-shadow:0 2px 5px #0008;
}
.playing-card.red{color:#d21e28}
.seat{
  position:absolute;
  width:115px;
  min-height:65px;
  background:#101713;
  border:1px solid #c49a50;
  border-radius:9px;
  padding:8px;
  text-align:center;
  font-size:12px;
  color:white;
}
.seat strong{display:block;color:var(--gold);margin-bottom:4px}
.seat small{color:#c7c7b9}
.seat-1{top:12px;left:12%}
.seat-2{top:12px;right:12%}
.seat-3{top:45%;right:8px}
.seat-4{bottom:12px;right:12%}
.seat-5{bottom:12px;left:12%}
.seat-6{top:45%;left:8px}
.actions{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  padding:18px 0;
}
.actions input{
  width:110px;
  padding:11px;
  background:#111713;
  border:1px solid #66512f;
  border-radius:8px;
  color:white;
}
.contacts{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}
.contacts a{
  color:var(--gold);
  text-decoration:none;
  padding:12px;
  border:1px solid #4a3b26;
  border-radius:8px;
}
.auth-screen{
  position:fixed;
  inset:0;
  z-index:30;
  background:#070908;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}
.auth-box{
  width:min(420px,100%);
  background:#111713;
  border:1px solid #594525;
  border-radius:16px;
  padding:30px;
  box-shadow:0 15px 50px #000;
}
.auth-box h1{
  text-align:center;
  color:var(--gold);
  letter-spacing:3px;
}
.auth-box input{
  display:block;
  width:100%;
  margin:12px 0;
  padding:14px;
  background:#080d0a;
  color:white;
  border:1px solid #51432b;
  border-radius:8px;
}
.auth-box button{width:100%;margin-top:10px}
.auth-switch{
  color:#c9b994;
  text-align:center;
  margin-top:18px;
  cursor:pointer;
}
.message{
  color:#ff8585;
  font-size:13px;
  margin-top:10px;
}
@media(max-width:700px){
  header{height:60px;padding:0 4%}
  .logo{font-size:20px}
  main{width:96%;margin:15px auto}
  .hero{padding:23px}
  .nav-grid{gap:7px}
  .nav-card{padding:15px 5px;font-size:13px}
  .panel{padding:14px}
  .table-list{grid-template-columns:1fr}
  .poker-table{min-height:430px;border-width:8px}
  .seat{width:86px;font-size:10px;padding:6px}
  .playing-card{width:34px;height:49px;font-size:16px}
  .seat-1{left:5%}
  .seat-2{right:5%}
  .seat-4{right:5%}
  .seat-5{left:5%}
  .seat-3{right:2px}
  .seat-6{left:2px}
}
</style>
</head>
<body>

<div class="auth-screen" id="authScreen">
  <div class="auth-box">
    <h1>BLACKCLUB</h1>
    <p style="text-align:center;color:#aaa">ONLINE POKER CLUB</p>
    <input id="authUsername" placeholder="Хэрэглэгчийн нэр">
    <input id="authPassword" type="password" placeholder="Нууц үг">
    <button class="gold-btn" id="loginBtn" onclick="login()">НЭВТРЭХ</button>
    <button class="secondary-btn" id="registerBtn" onclick="register()">БҮРТГҮҮЛЭХ</button>
    <div class="message" id="authMessage"></div>
  </div>
</div>

<header>
  <div class="logo">BLACK<span>CLUB</span></div>
  <div class="header-right">
    <span><i class="online-dot"></i>ONLINE</span>
    <span id="userName"></span>
    <button class="secondary-btn" onclick="logout()">ГАРАХ</button>
  </div>
</header>

<main id="lobbyPage">
  <section class="hero">
    <h1>WELCOME TO BLACKCLUB</h1>
    <p>Тавтай морил. Өөрийн ширээг сонгоод тоглоомдоо нэгдээрэй.</p>
  </section>

  <div class="nav-grid">
    <div class="nav-card" onclick="showPage('lobby')">♠ ШИРЭЭ</div>
    <div class="nav-card" onclick="alert('Тэмцээн удахгүй')">🏆 ТЭМЦЭЭН</div>
    <div class="nav-card" onclick="alert('Шагнал удахгүй')">🎁 ШАГНАЛ</div>
  </div>

  <section class="panel">
    <div class="panel-title">
      <h2>ПОКЕРЫН ШИРЭЭ</h2>
      <span id="onlineCount">0 ONLINE</span>
    </div>
    <div class="tabs">
      <button class="tab active" onclick="setFilter('all',this)">БҮГД</button>
      <button class="tab" onclick="setFilter('texas',this)">TEXAS</button>
      <button class="tab" onclick="setFilter('omaha',this)">OMAHA</button>
    </div>
    <div class="table-list" id="tableList"></div>
  </section>

  <section class="panel">
    <h2 style="color:var(--gold)">ХОЛБОО БАРИХ</h2>
    <div class="contacts">
      <a href="https://t.me/" target="_blank">TELEGRAM</a>
      <a href="https://facebook.com/" target="_blank">FACEBOOK</a>
    </div>
  </section>
</main>

<main id="tablePage">
  <button class="secondary-btn" onclick="leaveTable()">← БУЦАХ</button>
  <section class="panel">
    <div class="panel-title">
      <h2 id="tableTitle">POKER TABLE</h2>
      <span id="tableInfo"></span>
    </div>
    <div class="poker-table">
      <div class="table-inner"></div>
      <div class="table-name">BLACKCLUB</div>
      <div class="pot"><small>POT</small><span id="potAmount">0</span></div>
      <div class="board" id="boardCards"></div>
      <div class="seat seat-1" id="seat0"></div>
      <div class="seat seat-2" id="seat1"></div>
      <div class="seat seat-3" id="seat2"></div>
      <div class="seat seat-4" id="seat3"></div>
      <div class="seat seat-5" id="seat4"></div>
      <div class="seat seat-6" id="seat5"></div>
    </div>
    <div class="actions">
      <button class="secondary-btn" onclick="sendAction('fold')">FOLD</button>
      <button class="secondary-btn" onclick="sendAction('check')">CHECK</button>
      <button class="secondary-btn" onclick="sendAction('call')">CALL</button>
      <input id="raiseAmount" type="number" min="1" placeholder="Дүн">
      <button class="gold-btn" onclick="sendAction('raise')">RAISE</button>
      <button class="gold-btn" onclick="nextHand()">NEXT HAND</button>
    </div>
  </section>
</main>
<script>
const SERVER_URL = "https://black-new.onrender.com";

let socket = null;
let token = localStorage.getItem("blackclub_token") || "";
let user = null;
let allTables = [];
let filter = "all";
let currentTable = null;
let lastState = null;

const $ = id => document.getElementById(id);

async function api(path, data = {}) {
  const response = await fetch(SERVER_URL + path, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      ...(token ? { "Authorization": "Bearer " + token } : {})
    },
    body: JSON.stringify(data)
  });

  const result = await response.json();

  if (!response.ok) {
    throw new Error(result.message || result.error || "Алдаа гарлаа");
  }

  return result;
}

function showMessage(message) {
  $("authMessage").textContent = message;
}

async function login() {
  const username = $("authUsername").value.trim();
  const password = $("authPassword").value;

  if (!username || !password) {
    showMessage("Нэр болон нууц үгээ оруулна уу");
    return;
  }

  try {
    $("loginBtn").disabled = true;
    const result = await api("/api/login", { username, password });
    acceptLogin(result);
  } catch (error) {
    showMessage(error.message);
  } finally {
    $("loginBtn").disabled = false;
  }
}

async function register() {
  const username = $("authUsername").value.trim();
  const password = $("authPassword").value;

  if (!username || !password) {
    showMessage("Нэр болон нууц үгээ оруулна уу");
    return;
  }

  if (password.length < 6) {
    showMessage("Нууц үг 6-аас дээш тэмдэгттэй байна");
    return;
  }

  try {
    $("registerBtn").disabled = true;
    const result = await api("/api/register", { username, password });
    acceptLogin(result);
  } catch (error) {
    showMessage(error.message);
  } finally {
    $("registerBtn").disabled = false;
  }
}

function acceptLogin(result) {
  token = result.token || result.idToken || result.accessToken;

  if (!token) {
    showMessage("Нэвтрэх токен ирсэнгүй");
    return;
  }

  localStorage.setItem("blackclub_token", token);
  user = result.user || result;

  $("authScreen").style.display = "none";
  $("userName").textContent = user.username || user.name || "PLAYER";

  showLobby();
  connectSocket();
}

async function boot() {
  if (!token) {
    $("authScreen").style.display = "flex";
    return;
  }

  try {
    const result = await api("/api/me");
    user = result.user || result;

    $("authScreen").style.display = "none";
    $("userName").textContent = user.username || user.name || "PLAYER";

    showLobby();
    connectSocket();
  } catch (error) {
    localStorage.removeItem("blackclub_token");
    token = "";
    $("authScreen").style.display = "flex";
  }
}

function logout() {
  if (socket) socket.disconnect();

  localStorage.removeItem("blackclub_token");
  token = "";
  user = null;
  currentTable = null;

  $("authScreen").style.display = "flex";
  $("lobbyPage").style.display = "block";
  $("tablePage").style.display = "none";
}

function showLobby() {
  $("lobbyPage").style.display = "block";
  $("tablePage").style.display = "none";
}

function showPage(page) {
  if (page === "lobby") showLobby();
}

function connectSocket() {
  if (socket) socket.disconnect();

  socket = io(SERVER_URL, {
    auth: { token },
    transports: ["websocket", "polling"]
  });

  socket.on("connect", () => {
    socket.emit("lobby:get");
  });

  socket.on("connect_error", error => {
    console.error("Socket холболтын алдаа:", error.message);
  });

  socket.on("lobby:update", data => {
    allTables = Array.isArray(data) ? data : (data.tables || []);
    renderTables();
    $("onlineCount").textContent =
      (data.onlineCount ?? data.online ?? 0) + " ONLINE";
  });

  socket.on("table:update", data => {
    lastState = data;
    renderTable(data);
  });

  socket.on("notice", data => {
    const message = typeof data === "string"
      ? data
      : (data.message || "Мэдэгдэл");

    alert(message);
  });
}

function setFilter(value, button) {
  filter = value;

  document.querySelectorAll(".tab").forEach(tab => {
    tab.classList.remove("active");
  });

  button.classList.add("active");
  renderTables();
}

function renderTables() {
  const list = $("tableList");
  list.innerHTML = "";

  const tables = allTables.filter(table => {
    const type = String(table.type || table.game || "").toLowerCase();

    if (filter === "all") return true;
    return type.includes(filter);
  });

  if (!tables.length) {
    list.innerHTML =
      '<p style="color:#aaa">Одоогоор ширээ алга байна.</p>';
    return;
  }

  tables.forEach((table, index) => {
    const id = table.id || table.tableId || String(index);
    const name = table.name || table.title || "Ширээ " + (index + 1);
    const type = String(table.type || table.game || "Texas").toUpperCase();
    const players = table.players || table.seats || [];
    const count = Array.isArray(players)
      ? players.filter(Boolean).length
      : (table.playerCount || 0);

    const card = document.createElement("div");
    card.className = "table-card";

    card.innerHTML = `
      <div>
        <h3>${escapeHtml(name)}</h3>
        <p>${escapeHtml(type)} · ${count}/6 тоглогч</p>
      </div>
      <button class="gold-btn">СУУХ</button>
    `;

    card.querySelector("button").addEventListener("click", () => {
      joinTable(id);
    });

    list.appendChild(card);
  });
}

function joinTable(tableId) {
  if (!socket || !socket.connected) {
    alert("Сервертэй холбогдоогүй байна. Дахин оролдоно уу.");
    return;
  }

  socket.emit("table:join", { tableId }, result => {
    if (!result || !result.success) {
      alert(result?.message || "Ширээнд сууж чадсангүй");
      return;
    }

    currentTable = tableId;
    $("lobbyPage").style.display = "none";
    $("tablePage").style.display = "block";

    if (result.table) {
      lastState = result.table;
      renderTable(result.table);
    }
  });
}

function cardHtml(card) {
  if (!card) {
    return '<div class="playing-card" style="background:#ddd">?</div>';
  }

  const value = card.rank || card.value || card.card || "";
  const suit = card.suit || "";
  const red = ["♥", "♦", "hearts", "diamonds", "heart", "diamond"]
    .includes(String(suit).toLowerCase());

  const symbols = {
    hearts: "♥",
    heart: "♥",
    diamonds: "♦",
    diamond: "♦",
    clubs: "♣",
    club: "♣",
    spades: "♠",
    spade: "♠"
  };

  const symbol = symbols[String(suit).toLowerCase()] || suit;

  return `<div class="playing-card ${red ? "red" : ""}">
    ${escapeHtml(String(value))}${escapeHtml(String(symbol))}
  </div>`;
}

function renderTable(data) {
  if (!data) return;

  const table = data.table || data;
  const players = table.players || table.seats || [];
  const board = table.board || table.communityCards || [];

  $("tableTitle").textContent =
    table.name || table.title || "BLACKCLUB POKER";

  $("tableInfo").textContent =
    String(table.type || table.game || "").toUpperCase();

  $("potAmount").textContent =
    table.pot ?? table.totalPot ?? 0;

  $("boardCards").innerHTML = board.map(cardHtml).join("");

  for (let i = 0; i < 6; i++) {
    const seat = $("seat" + i);
    const player = players[i];

    if (!player) {
      seat.innerHTML = `<strong>СУУДАЛ ${i + 1}</strong><small>Хоосон</small>`;
      continue;
    }

    const name = player.username || player.name || "PLAYER";
    const chips = player.chips ?? player.stack ?? 0;

    seat.innerHTML = `
      <strong>${escapeHtml(name)}</strong>
      <small>${escapeHtml(String(chips))} chips</small>
    `;
  }
}

function sendAction(action) {
  if (!socket || !currentTable) {
    alert("Эхлээд ширээнд сууна уу");
    return;
  }

  const amount = Number($("raiseAmount").value || 0);

  socket.emit("game:action", {
    action,
    amount
  });
}

function nextHand() {
  if (!socket || !currentTable) return;
  socket.emit("game:next");
}

function leaveTable() {
  if (socket && currentTable) {
    socket.emit("table:leave");
  }

  currentTable = null;
  lastState = null;
  showLobby();

  if (socket) socket.emit("lobby:get");
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

boot();
</script>

</body>
</html>
