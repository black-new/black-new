<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BLACKCLUB Poker</title>
<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

<style>
:root{
  --gold:#e8bd62;
  --gold2:#9b7131;
  --bg:#050b14;
  --table-blue:#07366f;
  --card-gold:#d9b45b;
  --panel:#0c1521;
  --green:#07366f;
  --text:#f5f0e5;
  --muted:#9b9b91;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
}
button,input{font:inherit}
button{cursor:pointer}

header{
  min-height:72px;
  padding:0 4%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid #26384d;
  background:#07101c;
  position:sticky;
  top:0;
  z-index:20;
}
.logo{
  color:var(--gold);
  font-size:25px;
  font-weight:900;
  letter-spacing:3px;
}
.logo span{color:white}

.header-right{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:12px;
  color:var(--muted);
  font-size:13px;
}
.online-status{
  white-space:nowrap;
}
.online-dot{
  display:inline-block;
  width:8px;
  height:8px;
  border-radius:50%;
  background:#36d887;
  margin-right:5px;
}
.header-chip{
  display:flex;
  align-items:center;
  gap:6px;
  padding:7px 10px;
  border:1px solid var(--gold);
  border-radius:5px;
  color:#f6d98e;
  background:#211a0e;
  font-size:12px;
  font-weight:bold;
  white-space:nowrap;
}
.header-chip-icon{
  width:13px;
  height:13px;
  display:inline-block;
  border:2px dashed #ffe3a0;
  background:#b88635;
  border-radius:50%;
}
.header-user{
  display:flex;
  align-items:center;
  gap:7px;
  color:#f5d58d;
  font-weight:bold;
  max-width:150px;
}
.header-user-name{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.header-avatar{
  width:34px;
  height:34px;
  flex-shrink:0;
  border-radius:50%;
  border:2px solid var(--gold);
  background:radial-gradient(circle at 35% 25%,#80602e,#241a0d 75%);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#ffe4a3;
  font-weight:900;
  font-size:14px;
}
.menu-button{
  width:38px;
  height:38px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:5px;
  border:1px solid #5b4728;
  border-radius:7px;
  background:#151914;
  flex-shrink:0;
}
.menu-button span{
  width:18px;
  height:2px;
  border-radius:2px;
  background:var(--gold);
}
.menu-button:hover{border-color:var(--gold)}

.account-menu{
  display:none;
  position:absolute;
  top:62px;
  right:4%;
  width:min(310px,92vw);
  padding:17px;
  background:#0c1725;
  border:1px solid #806333;
  border-radius:12px;
  box-shadow:0 12px 35px #000c;
  z-index:50;
}
.account-menu.open{display:block}
.account-menu-head{
  display:flex;
  align-items:center;
  gap:12px;
  padding-bottom:14px;
  border-bottom:1px solid #40331f;
  margin-bottom:10px;
}
.account-menu-avatar{
  width:46px;
  height:46px;
  border-radius:50%;
  border:2px solid var(--gold);
  background:#302512;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#ffe3a0;
  font-weight:bold;
  font-size:19px;
}
.account-menu-name{
  color:#f5d58d;
  font-weight:bold;
  margin-bottom:5px;
}
.account-menu-balance{
  color:var(--gold);
  font-size:12px;
}
.menu-item{
  display:flex;
  align-items:center;
  gap:11px;
  width:100%;
  padding:12px 10px;
  border:0;
  border-radius:7px;
  background:transparent;
  color:#eee5d2;
  text-align:left;
  font-size:14px;
}
.menu-item:hover{
  background:#282115;
  color:var(--gold);
}
.menu-item-icon{
  width:20px;
  text-align:center;
  color:var(--gold);
}
.menu-divider{
  height:1px;
  background:#40331f;
  margin:8px 0;
}
.account-section{
  display:none;
  position:fixed;
  inset:0;
  z-index:60;
  background:#000b;
  padding:20px;
  align-items:center;
  justify-content:center;
}
.account-section.open{display:flex}
.account-box{
  width:min(430px,100%);
  max-height:85vh;
  overflow:auto;
  background:#0c1725;
  border:1px solid #806333;
  border-radius:14px;
  padding:20px;
  box-shadow:0 15px 45px #000;
}
.account-box-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
}
.account-box-head h2{
  margin:0;
  color:var(--gold);
  font-size:19px;
}
.close-account{
  border:1px solid #5b4728;
  color:var(--gold);
  background:#171b15;
  border-radius:7px;
  padding:7px 11px;
}
.account-info-row{
  padding:12px 0;
  border-bottom:1px solid #30291e;
  display:flex;
  justify-content:space-between;
  gap:12px;
  font-size:13px;
}
.account-info-row span:first-child{color:var(--muted)}
.account-info-row strong{
  color:#f5d58d;
  text-align:right;
  overflow-wrap:anywhere;
}
.history-empty{
  padding:20px 10px;
  text-align:center;
  color:var(--muted);
  font-size:13px;
}

main{
  width:min(1200px,94%);
  margin:30px auto;
}
.hero{
  padding:35px;
  border:1px solid #3d3020;
  border-radius:15px;
  background:linear-gradient(120deg,#171b15,#090c0a);
  margin-bottom:25px;
}
.hero h1{
  font-size:clamp(27px,5vw,45px);
  color:var(--gold);
  margin:0 0 10px;
  letter-spacing:2px;
}
.hero p{color:var(--muted);margin:0}

.nav-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  margin-bottom:25px;
}
.nav-card{
  padding:22px;
  border:1px solid #47371f;
  background:#111612;
  border-radius:12px;
  text-align:center;
  color:var(--gold);
  font-weight:bold;
  font-size:17px;
}
.nav-card:hover{
  background:#1d241b;
  border-color:var(--gold);
}
.panel{
  background:var(--panel);
  border:1px solid #26384d;
  border-radius:14px;
  padding:22px;
  margin-bottom:20px;
}
.panel-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}
.panel-title h2{
  color:var(--gold);
  font-size:20px;
  margin:0;
}
.tabs{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}
.tab{
  border:1px solid #4a3b26;
  color:#c9b994;
  background:#151914;
  padding:10px 16px;
  border-radius:8px;
}
.tab.active{
  background:var(--gold);
  color:#17130b;
  font-weight:bold;
}
.table-list{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}
.table-card{
  background:#0b100d;
  border:1px solid #34372a;
  padding:17px;
  border-radius:11px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}
.table-card h3{margin:0 0 7px;color:var(--gold)}
.table-card p{margin:0;color:var(--muted);font-size:13px}
.gold-btn{
  border:0;
  border-radius:8px;
  padding:11px 18px;
  background:linear-gradient(135deg,#f4d58a,#b88736);
  color:#171108;
  font-weight:bold;
}
.gold-btn:hover{filter:brightness(1.1)}
.secondary-btn{
  border:1px solid #67512d;
  background:#171b15;
  color:var(--gold);
  border-radius:8px;
  padding:10px 15px;
}

/* POKER TABLE */
#tablePage{display:none}
.poker-table{
  width:100%;
  height:490px;
  min-height:490px;
  position:relative;
  background:radial-gradient(ellipse at 50% 45%,var(--table-blue) 0%,#062a55 72%,#03172e 100%);
  border:12px solid #182638;
  border-radius:50% / 50%;
  box-shadow:
    inset 0 0 0 3px #d3aa55,
    inset 0 0 35px #001126,
    0 12px 35px #000;
  overflow:hidden;
  margin:20px 0;
}
.table-inner{
  position:absolute;
  inset:15px;
  border:2px solid rgba(221,181,91,.55);
  border-radius:50% / 50%;
  pointer-events:none;
}
.table-name{
  position:absolute;
  top:13%;
  left:50%;
  transform:translateX(-50%);
  color:#e8d4a5;
  font-weight:bold;
  letter-spacing:3px;
  font-size:13px;
}
.pot{
  position:absolute;
  top:28%;
  left:50%;
  transform:translateX(-50%);
  text-align:center;
  color:white;
  font-weight:bold;
  z-index:2;
}
.pot small{
  display:block;
  color:#e8d4a5;
  margin-bottom:5px;
  letter-spacing:2px;
}
.board{
  position:absolute;
  top:47%;
  left:50%;
  transform:translate(-50%,-50%);
  display:flex;
  gap:7px;
  z-index:2;
}
.playing-card{
  width:43px;
  height:61px;
  border-radius:6px;
  background:linear-gradient(145deg,#fff7dc,#d9b45b);
  color:#17120a;
  border:1px solid #f2d68b;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:19px;
  font-weight:bold;
  box-shadow:0 2px 5px #0008;
}
.playing-card.red{color:#a51e2a}
.playing-card:not(.red){color:#17120a}

/* PLAYER SEATS */
.seat{
  position:absolute;
  width:120px;
  min-height:90px;
  background:linear-gradient(145deg,#18221b,#080e0b);
  border:1px solid #c49a50;
  border-radius:12px;
  padding:7px 5px;
  text-align:center;
  font-size:12px;
  color:white;
  box-shadow:0 4px 12px #0008;
  z-index:3;
}
.seat strong{
  display:block;
  color:#f5d58d;
  margin:4px 0;
  font-size:12px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.seat small{
  color:#c7c7b9;
  display:block;
}
.avatar{
  width:38px;
  height:38px;
  margin:0 auto 3px;
  border-radius:50%;
  border:2px solid var(--gold);
  background:radial-gradient(circle at 35% 25%,#80602e,#241a0d 75%);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#ffe4a3;
  font-size:17px;
  font-weight:900;
  box-shadow:0 0 9px #d6a94c55;
}
.seat-empty .avatar{
  border-color:#77705d;
  background:#18221b;
  color:#8c927f;
}
.chip-display{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:5px;
  margin-top:4px;
  padding:3px 8px;
  border-radius:5px;
  background:#302512;
  border:1px solid #a9823d;
  color:#f6d98e;
  font-size:11px;
  font-weight:bold;
}
.chip-icon{
  width:13px;
  height:13px;
  border-radius:50%;
  border:2px dashed #ffe3a0;
  background:#b88635;
  display:inline-block;
}
.seat-1{top:5%;left:18%}
.seat-2{top:5%;right:18%}
.seat-3{top:40%;right:2%}
.seat-4{bottom:5%;right:18%}
.seat-5{bottom:5%;left:18%}
.seat-6{top:40%;left:2%}

.actions{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  padding:18px 0;
}
.actions input{
  width:110px;
  padding:11px;
  background:#0c1725;
  border:1px solid #66512f;
  border-radius:8px;
  color:white;
}
.contacts{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}
.contacts a{
  color:var(--gold);
  text-decoration:none;
  padding:12px;
  border:1px solid #4a3b26;
  border-radius:8px;
}

/* LOGIN */
.auth-screen{
  position:fixed;
  inset:0;
  z-index:30;
  background:#070908;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}
.auth-box{
  width:min(420px,100%);
  background:#0c1725;
  border:1px solid #594525;
  border-radius:16px;
  padding:30px;
  box-shadow:0 15px 50px #000;
}
.auth-box h1{
  text-align:center;
  color:var(--gold);
  letter-spacing:3px;
}
.auth-box input{
  display:block;
  width:100%;
  margin:12px 0;
  padding:14px;
  background:#080d0a;
  color:white;
  border:1px solid #51432b;
  border-radius:8px;
}
.auth-box button{width:100%;margin-top:10px}
.auth-switch{
  color:#c9b994;
  text-align:center;
  margin-top:18px;
  cursor:pointer;
}
.message{
  color:#ff8585;
  font-size:13px;
  margin-top:10px;
}

/* MOBILE */
@media(max-width:700px){
  header{
    min-height:60px;
    padding:0 3%;
  }
  .logo{font-size:18px;letter-spacing:2px}
  .header-right{gap:7px}
  .online-status{display:none}
  .header-chip{font-size:10px;padding:6px 7px;gap:4px}
  .header-user{gap:5px;max-width:95px;font-size:11px}
  .header-avatar{width:29px;height:29px;font-size:12px}
  .menu-button{width:33px;height:33px}
  .menu-button span{width:16px}
  .account-menu{top:54px;right:3%}
  main{width:96%;margin:15px auto}
  .hero{padding:23px}
  .nav-grid{gap:7px}
  .nav-card{padding:15px 5px;font-size:13px}
  .panel{padding:14px}
  .table-list{grid-template-columns:1fr}
  .poker-table{
    height:430px;
    min-height:430px;
    border-width:8px;
  }
  .table-inner{inset:10px}
  .seat{
    width:88px;
    min-height:78px;
    font-size:10px;
    padding:5px 3px;
  }
  .seat strong{font-size:10px}
  .avatar{width:32px;height:32px;font-size:14px}
  .chip-display{font-size:9px;padding:2px 5px}
  .playing-card{width:34px;height:49px;font-size:16px}
  .board{gap:4px}
  .seat-1{top:5%;left:15%}
  .seat-2{top:5%;right:15%}
  .seat-3{top:41%;right:1%}
  .seat-4{bottom:5%;right:15%}
  .seat-5{bottom:5%;left:15%}
  .seat-6{top:41%;left:1%}
}

body.classic-cards .playing-card{background:#fff;color:#111;border-color:#d8d8d8}
body.classic-cards .playing-card.red{color:#d21e28}
/* BLACKCLUB BLUE + GOLD REFRESH */
#tablePage{width:min(1500px,96%);margin:18px auto}
#tablePage>.panel{background:linear-gradient(145deg,#0b1726,#060d17);border-color:#263d57;padding:18px}
#tablePage>.secondary-btn{margin-bottom:8px}
.poker-table{background:radial-gradient(ellipse at 50% 45%,var(--table-blue) 0%,#062a55 70%,#03172e 100%);border-color:#1c2b3d;box-shadow:inset 0 0 0 3px #d9b45b,inset 0 0 38px #001126,0 14px 40px #000b}
.seat{border-radius:22px;background:linear-gradient(145deg,#111f30,#050c16);border-color:#caa34f;box-shadow:0 5px 16px #000b}
.avatar{border-color:#e0b95f;background:radial-gradient(circle at 35% 25%,#d9b45b,#172235 75%);color:#fff1c7}
.actions{border-top:1px solid #26384d;margin-top:8px}
.actions .secondary-btn{min-width:100px;background:linear-gradient(145deg,#14263a,#091321);border-color:#47617d;color:#f4f6fa;font-weight:bold}
.actions .gold-btn{min-width:105px;background:linear-gradient(135deg,#f2d58b,#b7832e);box-shadow:0 4px 14px #0007}
.actions button:active{transform:translateY(1px);filter:brightness(1.15)}
.theme-options{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:10px 0 18px}
.theme-swatch{height:38px;border:2px solid #526174;border-radius:10px;cursor:pointer}
.theme-swatch.selected{outline:2px solid #e8bd62;outline-offset:2px}
.card-options{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.card-choice{padding:10px 13px;border:1px solid #526174;border-radius:9px;background:#101d2d;color:#f5e5bd;cursor:pointer}
.card-choice.selected{border-color:#e8bd62;box-shadow:0 0 0 1px #e8bd62}
@media(max-width:700px){
  #tablePage{width:100%;margin:10px auto}
  #tablePage>.panel{padding:10px 7px;border-radius:12px}
  .poker-table{width:min(94vw,430px);height:auto;aspect-ratio:1/1;min-height:0;margin:14px auto;border-width:7px;border-radius:50%;}
  .table-inner{inset:9px;border-width:1px}
  .table-name{top:17%;font-size:10px;letter-spacing:2px}
  .pot{top:29%;font-size:12px}
  .pot small{font-size:9px;margin-bottom:2px}
  .board{top:48%;gap:3px;max-width:88%;}
  .playing-card{width:clamp(29px,8vw,36px);height:clamp(42px,11vw,52px);font-size:clamp(13px,4vw,17px);border-radius:5px}
  .seat{width:clamp(66px,20vw,82px);min-height:0;padding:4px 3px;border-radius:14px;font-size:9px}
  .seat strong{font-size:9px;margin:2px 0}
  .seat small{font-size:8px}
  .avatar{width:clamp(27px,8vw,34px);height:clamp(27px,8vw,34px);font-size:13px;margin-bottom:1px}
  .chip-display{font-size:8px;padding:2px 4px;margin-top:2px}
  .chip-icon{width:9px;height:9px}
  .seat-1{top:4%;left:19%}.seat-2{top:4%;right:19%}
  .seat-3{top:39%;right:0%}.seat-4{bottom:4%;right:19%}
  .seat-5{bottom:4%;left:19%}.seat-6{top:39%;left:0%}
  .actions{gap:6px;padding:12px 3px;}
  .actions button{min-width:0!important;padding:10px 9px;font-size:11px;flex:1}
  .actions input{width:82px;padding:9px;font-size:12px}
}
@media(min-width:701px){
  .poker-table{height:clamp(490px,58vh,680px);}
  .seat{width:132px;min-height:92px;border-radius:22px;padding:9px 7px}
  .avatar{width:46px;height:46px;font-size:18px}
  .seat strong{font-size:13px}
}

</style>
</head>

<body>

<div class="auth-screen" id="authScreen">
  <div class="auth-box">
    <h1>BLACKCLUB</h1>
    <p style="text-align:center;color:#aaa">ONLINE POKER CLUB</p>
    <input id="authUsername" placeholder="Хэрэглэгчийн нэр">
    <input id="authPassword" type="password" placeholder="Нууц үг">
    <button class="gold-btn" id="loginBtn" onclick="login()">НЭВТРЭХ</button>
    <button class="secondary-btn" id="registerBtn" onclick="register()">БҮРТГҮҮЛЭХ</button>
    <div class="message" id="authMessage"></div>
  </div>
</div>

<header>
  <div class="logo">BLACK<span>CLUB</span></div>

  <div class="header-right">
    <span class="header-chip">
      <i class="header-chip-icon"></i>
      <span id="headerChips">0 CHIP</span>
    </span>

    <div class="header-user">
      <span class="header-user-name" id="userName">Тоглогч</span>
      <div class="header-avatar" id="headerAvatar">P</div>
    </div>

    <button class="menu-button" id="menuButton"
      onclick="toggleAccountMenu()" aria-label="Цэс">
      <span></span><span></span><span></span>
    </button>
  </div>

  <div class="account-menu" id="accountMenu">
    <div class="account-menu-head">
      <div class="account-menu-avatar" id="menuAvatar">P</div>
      <div>
        <div class="account-menu-name" id="menuUserName">Тоглогч</div>
        <div class="account-menu-balance" id="menuBalance">0 CHIP</div>
      </div>
    </div>

    <button class="menu-item" onclick="openAccountSection('account')">
      <span class="menu-item-icon">👤</span> Account мэдээлэл
    </button>
    <button class="menu-item" onclick="openAccountSection('balance')">
      <span class="menu-item-icon">◉</span> CHIP-ийн үлдэгдэл
    </button>
    <button class="menu-item" onclick="openAccountSection('history')">
      <span class="menu-item-icon">◷</span> Тоглоомын түүх
    </button>
    <button class="menu-item" onclick="openAccountSection('settings')">
      <span class="menu-item-icon">⚙</span> Хувийн тохиргоо
    </button>
    <div class="menu-divider"></div>
    <button class="menu-item" onclick="logout()">
      <span class="menu-item-icon">⇥</span> Гарах
    </button>
  </div>
</header>

<div class="account-section" id="accountSection"
  onclick="if(event.target===this)closeAccountSection()">
  <div class="account-box">
    <div class="account-box-head">
      <h2 id="accountSectionTitle">ACCOUNT</h2>
      <button class="close-account" onclick="closeAccountSection()">✕</button>
    </div>
    <div id="accountSectionContent"></div>
  </div>
</div>

<main id="lobbyPage">
  <section class="hero">
    <h1>WELCOME TO BLACKCLUB</h1>
    <p>Тавтай морил. Өөрийн ширээг сонгоод тоглоомдоо нэгдээрэй.</p>
  </section>

  <div class="nav-grid">
    <div class="nav-card" onclick="showPage('lobby')">♠ ШИРЭЭ</div>
    <div class="nav-card" onclick="alert('Тэмцээн удахгүй')">🏆 ТЭМЦЭЭН</div>
    <div class="nav-card" onclick="alert('Шагнал удахгүй')">🎁 ШАГНАЛ</div>
  </div>

  <section class="panel">
    <div class="panel-title">
      <h2>ПОКЕРЫН ШИРЭЭ</h2>
      <span id="onlineCount">0 ONLINE</span>
    </div>
    <div class="tabs">
      <button class="tab active" onclick="setFilter('all',this)">БҮГД</button>
      <button class="tab" onclick="setFilter('texas',this)">TEXAS</button>
      <button class="tab" onclick="setFilter('omaha',this)">OMAHA</button>
    </div>
    <div class="table-list" id="tableList"></div>
  </section>

  <section class="panel">
    <h2 style="color:var(--gold)">ХОЛБОО БАРИХ</h2>
    <div class="contacts">
      <a href="https://t.me/" target="_blank">TELEGRAM</a>
      <a href="https://facebook.com/" target="_blank">FACEBOOK</a>
    </div>
  </section>
</main>

<main id="tablePage">
  <button class="secondary-btn" onclick="leaveTable()">← БУЦАХ</button>
  <section class="panel">
    <div class="panel-title">
      <h2 id="tableTitle">POKER TABLE</h2>
      <span id="tableInfo"></span>
    </div>

    <div class="poker-table">
      <div class="table-inner"></div>
      <div class="table-name">BLACKCLUB</div>
      <div class="pot">
        <small>POT</small>
        <span id="potAmount">0</span>
      </div>
      <div class="board" id="boardCards"></div>

      <div class="seat seat-1" id="seat0"></div>
      <div class="seat seat-2" id="seat1"></div>
      <div class="seat seat-3" id="seat2"></div>
      <div class="seat seat-4" id="seat3"></div>
      <div class="seat seat-5" id="seat4"></div>
      <div class="seat seat-6" id="seat5"></div>
    </div>

    <div class="actions">
      <button class="secondary-btn" onclick="sendAction('fold')">FOLD</button>
      <button class="secondary-btn" onclick="sendAction('check')">CHECK</button>
      <button class="secondary-btn" onclick="sendAction('call')">CALL</button>
      <input id="raiseAmount" type="number" min="1" placeholder="Дүн">
      <button class="gold-btn" onclick="sendAction('raise')">RAISE</button>
      <button class="gold-btn" onclick="nextHand()">NEXT HAND</button>
    </div>
  </section>
</main>
<script>
const SERVER_URL = "https://black-new.onrender.com";

let socket = null;
let token = localStorage.getItem("blackclub_token") || "";
let user = null;
let allTables = [];
let filter = "all";
let currentTable = null;
let lastState = null;

const $ = id => document.getElementById(id);

async function api(path, data = {}) {
  const response = await fetch(SERVER_URL + path, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + token
    },
    body: JSON.stringify(data)
  });

  const result = await response.json();

  if (!response.ok) {
    throw new Error(result.message || result.error || "Алдаа гарлаа");
  }

  return result;
}

function getUsername() {
  return user?.username || user?.name || "Тоглогч";
}

function getBalance() {
  return Number(
    user?.chips ??
    user?.balance ??
    user?.chipBalance ??
    user?.wallet ??
    0
  );
}

function updateHeader() {
  const name = getUsername();
  const initial = name.trim().charAt(0).toUpperCase() || "P";
  const balance = getBalance().toLocaleString("en-US") + " CHIP";

  $("userName").textContent = name;
  $("headerAvatar").textContent = initial;
  $("menuAvatar").textContent = initial;
  $("menuUserName").textContent = name;
  $("headerChips").textContent = balance;
  $("menuBalance").textContent = balance;
}

function toggleAccountMenu() {
  $("accountMenu").classList.toggle("open");
}

function closeAccountMenu() {
  $("accountMenu").classList.remove("open");
}

document.addEventListener("click", event => {
  const menu = $("accountMenu");
  const button = $("menuButton");

  if (
    menu &&
    !menu.contains(event.target) &&
    !button.contains(event.target)
  ) {
    closeAccountMenu();
  }
});

function openAccountSection(section) {
  closeAccountMenu();

  const content = $("accountSectionContent");
  const title = $("accountSectionTitle");

  if (section === "account") {
    title.textContent = "ACCOUNT МЭДЭЭЛЭЛ";

    content.innerHTML = `
      <div class="account-info-row">
        <span>Хэрэглэгчийн нэр</span>
        <strong>${escapeHtml(getUsername())}</strong>
      </div>
      <div class="account-info-row">
        <span>Эрх</span>
        <strong>${escapeHtml(user?.role || "Хэрэглэгч")}</strong>
      </div>
      <div class="account-info-row">
        <span>CHIP үлдэгдэл</span>
        <strong>${getBalance().toLocaleString("en-US")} CHIP</strong>
      </div>
    `;
  }

  if (section === "balance") {
    title.textContent = "CHIP ҮЛДЭГДЭЛ";

    content.innerHTML = `
      <div style="text-align:center;padding:20px 5px">
        <div style="color:#aaa;font-size:13px">Таны одоогийн үлдэгдэл</div>
        <div style="font-size:30px;color:#e8bd62;font-weight:bold;margin:15px 0">
          ${getBalance().toLocaleString("en-US")}
        </div>
        <div style="color:#e8bd62;font-size:13px">CHIP</div>
      </div>
    `;
  }

  if (section === "history") {
    title.textContent = "ТОГЛООМЫН ТҮҮХ";

    content.innerHTML = `
      <div class="history-empty">
        Одоогоор тоглоомын түүхийн мэдээлэл алга байна.
      </div>
    `;
  }

  if (section === "settings") {
    title.textContent = "ХУВИЙН ТОХИРГОО";
    content.innerHTML = `
      <div style="color:#e8bd62;font-weight:bold">Ширээний өнгө</div>
      <div class="theme-options">
        <button class="theme-swatch" style="background:#07366f" onclick="setTableTheme('#07366f',this)" aria-label="Хөх"></button>
        <button class="theme-swatch" style="background:#075536" onclick="setTableTheme('#075536',this)" aria-label="Ногоон"></button>
        <button class="theme-swatch" style="background:#651d2b" onclick="setTableTheme('#651d2b',this)" aria-label="Улаан"></button>
        <button class="theme-swatch" style="background:#263344" onclick="setTableTheme('#263344',this)" aria-label="Саарал"></button>
      </div>
      <div style="color:#e8bd62;font-weight:bold">Хөзрийн загвар</div>
      <div class="card-options">
        <button class="card-choice" onclick="setCardTheme('gold',this)">GOLD</button>
        <button class="card-choice" onclick="setCardTheme('classic',this)">CLASSIC</button>
      </div>
      <p style="color:#9babbc;font-size:12px;margin-top:14px">Таны сонголт энэ төхөөрөмж дээр хадгалагдана.</p>
    `;
    setTimeout(markSelectedThemes,0);
  }

  $("accountSection").classList.add("open");
}

function closeAccountSection() {
  $("accountSection").classList.remove("open");
}

function setTableTheme(color, button) {
  document.documentElement.style.setProperty('--table-blue', color);
  localStorage.setItem('blackclub_table_color', color);
  document.querySelectorAll('.theme-swatch').forEach(x=>x.classList.remove('selected'));
  if (button) button.classList.add('selected');
}

function setCardTheme(theme, button) {
  document.body.classList.toggle('classic-cards', theme === 'classic');
  localStorage.setItem('blackclub_card_theme', theme);
  document.querySelectorAll('.card-choice').forEach(x=>x.classList.remove('selected'));
  if (button) button.classList.add('selected');
}

function markSelectedThemes() {
  const color = localStorage.getItem('blackclub_table_color') || '#07366f';
  const theme = localStorage.getItem('blackclub_card_theme') || 'gold';
  document.querySelectorAll('.theme-swatch').forEach(x=>{
    if (x.getAttribute('onclick')?.includes(color)) x.classList.add('selected');
  });
  document.querySelectorAll('.card-choice').forEach(x=>{
    if (x.textContent.toLowerCase() === theme) x.classList.add('selected');
  });
}

function loadVisualPreferences() {
  const color = localStorage.getItem('blackclub_table_color') || '#07366f';
  const theme = localStorage.getItem('blackclub_card_theme') || 'gold';
  document.documentElement.style.setProperty('--table-blue', color);
  document.body.classList.toggle('classic-cards', theme === 'classic');
}

async function login() {
  const username = $("authUsername").value.trim();
  const password = $("authPassword").value;

  if (!username || !password) {
    $("authMessage").textContent = "Нэр болон нууц үгээ оруулна уу";
    return;
  }

  try {
    $("authMessage").textContent = "Нэвтэрч байна...";
    const result = await api("/api/login", { username, password });
    acceptLogin(result);
  } catch (error) {
    $("authMessage").textContent = error.message;
  }
}

async function register() {
  const username = $("authUsername").value.trim();
  const password = $("authPassword").value;

  if (!username || !password) {
    $("authMessage").textContent = "Нэр болон нууц үгээ оруулна уу";
    return;
  }

  try {
    $("authMessage").textContent = "Бүртгүүлж байна...";
    const result = await api("/api/register", { username, password });
    acceptLogin(result);
  } catch (error) {
    $("authMessage").textContent = error.message;
  }
}

function acceptLogin(result) {
  token = result.token || result.user?.token || "";
  user = result.user || result;

  if (!token) {
    $("authMessage").textContent = "Нэвтрэх token олдсонгүй";
    return;
  }

  localStorage.setItem("blackclub_token", token);
  $("authScreen").style.display = "none";

  updateHeader();
  connectSocket();
  showLobby();
}

async function boot() {
  if (!token) {
    $("authScreen").style.display = "flex";
    return;
  }

  try {
    const result = await api("/api/me");
    user = result.user || result;

    $("authScreen").style.display = "none";
    updateHeader();

    connectSocket();
    showLobby();
  } catch (error) {
    localStorage.removeItem("blackclub_token");
    token = "";
    $("authScreen").style.display = "flex";
  }
}

function logout() {
  if (socket) socket.disconnect();

  localStorage.removeItem("blackclub_token");
  token = "";
  user = null;
  currentTable = null;

  closeAccountMenu();
  closeAccountSection();

  $("authScreen").style.display = "flex";
  $("lobbyPage").style.display = "block";
  $("tablePage").style.display = "none";
  $("authMessage").textContent = "";
}

function showLobby() {
  $("lobbyPage").style.display = "block";
  $("tablePage").style.display = "none";
  currentTable = null;

  if (socket && socket.connected) {
    socket.emit("lobby:get");
  }
}

function showPage(page) {
  if (page === "lobby") showLobby();
}

function connectSocket() {
  if (socket) socket.disconnect();

  socket = io(SERVER_URL, {
    auth: { token },
    transports: ["websocket", "polling"]
  });

  socket.on("connect", () => {
    socket.emit("lobby:get");
  });

  socket.on("connect_error", error => {
    console.error("Socket холболтын алдаа:", error.message);
  });

  socket.on("lobby:update", data => {
    const tables = Array.isArray(data) ? data : (data.tables || []);
    allTables = tables;

    if (data.onlineCount !== undefined) {
      $("onlineCount").textContent = data.onlineCount + " ONLINE";
    }

    renderTables();
  });

  socket.on("table:update", state => {
    lastState = state;
    renderTable(state);
  });

  socket.on("notice", message => {
    const text = typeof message === "string"
      ? message
      : message.message || "Мэдэгдэл";

    console.log("BLACKCLUB:", text);
  });
}

function setFilter(value, button) {
  filter = value;

  document.querySelectorAll(".tab").forEach(tab => {
    tab.classList.remove("active");
  });

  if (button) button.classList.add("active");

  renderTables();
}

function renderTables() {
  const list = $("tableList");
  list.innerHTML = "";

  const tables = allTables.filter(table => {
    if (filter === "all") return true;

    const type = String(
      table.type || table.gameType || table.game || ""
    ).toLowerCase();

    return type.includes(filter);
  });

  if (!tables.length) {
    list.innerHTML =
      '<p style="color:#aaa">Одоогоор ширээ алга байна.</p>';
    return;
  }

  tables.forEach(table => {
    const id = table.id || table.tableId;
    const name = table.name || table.title || "Poker Table";
    const game = table.type || table.gameType || table.game || "Poker";
    const players = table.players?.length ??
      table.playerCount ??
      table.seats?.filter(Boolean).length ??
      0;

    const maxPlayers = table.maxPlayers || 6;
    const card = document.createElement("div");

    card.className = "table-card";
    card.innerHTML = `
      <div>
        <h3>${escapeHtml(name)}</h3>
        <p>${escapeHtml(String(game))} · ${players}/${maxPlayers} тоглогч</p>
      </div>
      <button class="gold-btn">ОРОХ</button>
    `;

    card.querySelector("button").onclick = () => joinTable(id);
    list.appendChild(card);
  });
}

function joinTable(tableId) {
  if (!socket || !socket.connected) {
    alert("Сервертэй холбогдоогүй байна. Дахин оролдоно уу.");
    return;
  }

  socket.emit("table:join", { tableId }, result => {
    if (result && result.error) {
      alert(result.error);
      return;
    }

    currentTable = tableId;
    $("lobbyPage").style.display = "none";
    $("tablePage").style.display = "block";

    if (result && result.table) {
      lastState = result.table;
      renderTable(result.table);
    } else if (result && result.state) {
      lastState = result.state;
      renderTable(result.state);
    }
  });
}

function cardHtml(card) {
  if (!card) return "";

  const rank = card.rank || card.value || "";
  const suit = card.suit || "";

  const red = ["♥", "♦", "hearts", "diamonds", "heart", "diamond"]
    .includes(String(suit).toLowerCase());

  const symbols = {
    hearts: "♥",
    heart: "♥",
    diamonds: "♦",
    diamond: "♦",
    clubs: "♣",
    club: "♣",
    spades: "♠",
    spade: "♠"
  };

  const symbol = symbols[String(suit).toLowerCase()] || suit;

  return `<div class="playing-card ${red ? "red" : ""}">
    ${escapeHtml(String(rank))}${escapeHtml(String(symbol))}
  </div>`;
}

function getPlayerName(player) {
  return player?.username ||
    player?.name ||
    player?.user?.username ||
    player?.user?.name ||
    "Тоглогч";
}

function getPlayerChips(player) {
  return player?.chips ??
    player?.stack ??
    player?.balance ??
    player?.chipCount ??
    0;
}

function renderSeat(player, index) {
  const seat = $("seat" + index);

  if (!player) {
    seat.className = "seat seat-" + (index + 1) + " seat-empty";
    seat.innerHTML = `
      <div class="avatar">＋</div>
      <strong>СУЛ СУУДАЛ</strong>
      <small>Нээлттэй</small>
    `;
    return;
  }

  const name = getPlayerName(player);
  const chips = Number(getPlayerChips(player)).toLocaleString("en-US");
  const initial = name.trim().charAt(0).toUpperCase() || "P";

  const isMe =
    player.id === user?.id ||
    player.userId === user?.id ||
    player.username === user?.username;

  seat.className = "seat seat-" + (index + 1);

  seat.innerHTML = `
    <div class="avatar">${escapeHtml(initial)}</div>
    <strong>${escapeHtml(name)}</strong>
    <div class="chip-display">
      <span class="chip-icon"></span>
      <span>${chips} CHIP</span>
    </div>
    ${isMe ? '<small style="color:#f6d98e">ТАНЫ СУУДАЛ</small>' : ""}
  `;
}

function renderTable(state) {
  if (!state) return;

  const table = state.table || state;
  const players = table.players || state.players || [];
  const seats = table.seats || state.seats || [];

  $("tableTitle").textContent =
    table.name || table.title || "BLACKCLUB POKER";

  $("tableInfo").textContent =
    table.type || table.gameType || "";

  $("potAmount").textContent = Number(
    state.pot ?? table.pot ?? 0
  ).toLocaleString("en-US");

  const board = state.communityCards ||
    state.board ||
    table.communityCards ||
    [];

  $("boardCards").innerHTML = board.map(cardHtml).join("");

  const seatPlayers = Array(6).fill(null);

  if (Array.isArray(seats) && seats.length) {
    seats.forEach((seat, index) => {
      if (index < 6) {
        seatPlayers[index] = seat?.player || seat || null;
      }
    });
  } else if (Array.isArray(players)) {
    players.forEach((player, index) => {
      const position = Number.isInteger(player.seat)
        ? player.seat
        : index;

      if (position >= 0 && position < 6) {
        seatPlayers[position] = player;
      }
    });
  }

  seatPlayers.forEach((player, index) => {
    renderSeat(player, index);
  });
}

function sendAction(action) {
  if (!socket || !socket.connected || !currentTable) {
    alert("Ширээнд холбогдоогүй байна.");
    return;
  }

  const amount = Number($("raiseAmount").value || 0);

  socket.emit("game:action", {
    action,
    amount
  });
}

function nextHand() {
  if (!socket || !socket.connected || !currentTable) return;

  socket.emit("game:next");
}

function leaveTable() {
  if (socket && currentTable) {
    socket.emit("table:leave");
  }

  showLobby();
}

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

loadVisualPreferences();
boot();
</script>

</body>
</html>
